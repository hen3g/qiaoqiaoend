<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>验证码邮件</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f5f7; font-family:'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7; padding:40px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.06);">
          
          <!-- 顶部品牌区域 -->
          <tr>
            <td style="background-color:#4f46e5; padding:32px 40px; text-align:center;">
              <h1 style="margin:0; color:#ffffff; font-size:22px; font-weight:600;">{{title}}</h1>
            </td>
          </tr>

          <!-- 正文内容 -->
          <tr>
            <td style="padding:40px;">
              <h2 style="margin:0 0 16px; font-size:18px; color:#111827;">邮箱验证码</h2>
              <p style="margin:0 0 24px; font-size:14px; color:#6b7280; line-height:1.6;">
                您好，您正在进行邮箱验证操作，验证码为：
              </p>

              <!-- 验证码展示 -->
              <div style="text-align:center; margin:32px 0;">
                <span style="display:inline-block; padding:16px 32px; background-color:#f3f4f6; border-radius:8px; font-size:32px; font-weight:700; letter-spacing:8px; color:#4f46e5;">
                  {{code}}
                </span>
              </div>

              <p style="margin:0 0 8px; font-size:14px; color:#6b7280; line-height:1.6;">
                验证码有效期为 <strong style="color:#111827;">30 分钟</strong>，请勿泄露给他人。
              </p>
              <p style="margin:0; font-size:14px; color:#6b7280; line-height:1.6;">
                如果这不是您本人的操作，请忽略此邮件。
              </p>
            </td>
          </tr>

          <!-- 分割线 -->
          <tr>
            <td style="padding:0 40px;">
              <div style="border-top:1px solid #e5e7eb;"></div>
            </td>
          </tr>

          <!-- 底部信息 -->
          <tr>
            <td style="padding:24px 40px 32px; text-align:center;">
              <p style="margin:0; font-size:12px; color:#9ca3af; line-height:1.6;">
                此邮件由系统自动发送，请勿直接回复。<br>
                &copy; 2026 {{title}}. All rights reserved.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
